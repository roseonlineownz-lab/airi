name: Cloudflare Workers (Preview) Prepare

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  prepare:
    name: Prepare preview sources
    runs-on: ubuntu-latest

    steps:
      - name: Persist checkout metadata
        run: |
          cat <<EOF > preview_meta
          {
            "PR_NUM": ${{ toJSON(github.event.number) }},
            "REPO_FULL_NAME": ${{ toJSON(github.event.pull_request.head.repo.full_name) }},
            "HEAD_REF": ${{ toJSON(github.event.pull_request.head.ref) }},
            "HEAD_SHA": ${{ toJSON(github.event.pull_request.head.sha) }}
          }
          EOF

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-meta
          path: ./preview_meta
          overwrite: true
